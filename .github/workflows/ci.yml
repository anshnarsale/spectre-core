name: CI - TypeCheck & Build Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeCheck TypeScript
        run: npx tsc --noEmit

      - name: Build Production Dist
        run: npm run build

      - name: Verify Build Artifacts Exist
        run: |
          test -f dist/cli.js   && echo "✅ dist/cli.js found"   || (echo "❌ dist/cli.js missing" && exit 1)
          test -f dist/server.js && echo "✅ dist/server.js found" || (echo "❌ dist/server.js missing" && exit 1)
          test -f bin/tool.js   && echo "✅ bin/tool.js found"   || (echo "❌ bin/tool.js missing" && exit 1)
